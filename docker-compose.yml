version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: timetracking-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: timetracking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    image: timetracking-backend
    container_name: my-tracker-app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/timetracking_db
    depends_on:
      - db

volumes:
  postgres_data: