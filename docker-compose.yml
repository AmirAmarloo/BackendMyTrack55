version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: timetracking-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    image: timetracking-backend
    container_name: my-tracker-app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env          
    depends_on:
      - db

volumes:
  postgres_data: